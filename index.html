<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe. | 個人作品集</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-sand: #D8C9AE;
            --color-teal: #2A4B4C;
            --color-taupe: #8B7D6B;
        }
        
        body {
            background-color: var(--color-sand);
            color: var(--color-teal);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        .font-retro { font-family: 'Courier Prime', monospace; }

        .noise::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            opacity: 0.05;
            pointer-events: none;
            z-index: 9999;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .vinyl-record { animation: rotate 8s linear infinite; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--color-sand); }
        ::-webkit-scrollbar-thumb { background: var(--color-taupe); }

        .card-shadow { box-shadow: 8px 8px 0px var(--color-taupe); }
    </style>
</head>
<body class="noise">

    <div style="text-align: center; padding: 20px; background-color: #f7fafc; z-index: 1000; position: relative;">
        <a href="https://chyshenn.github.io/" style="color: #2A4B4C; font-weight: bold; text-decoration: underline; font-family: 'Courier Prime', monospace;">
            👈 回到個人履歷頁面
        </a>
    </div>

    <nav class="fixed top-20 w-full z-50 px-8 py-6 flex justify-between items-center bg-[#D8C9AE]/80 backdrop-blur-sm">
        <div class="text-2xl font-bold tracking-tighter font-retro">Vibe.</div>
        <div class="space-x-8 font-medium">
            <a href="#about" class="hover:text-[#8B7D6B] transition">About</a>
            <a href="#works" class="hover:text-[#8B7D6B] transition">Works</a>
            <a href="#contact" class="hover:text-[#8B7D6B] transition">Contact</a>
        </div>
    </nav>

    <section class="h-screen flex flex-col justify-center items-center text-center px-4">
        <h1 class="text-4xl md:text-6xl font-bold mb-4 opacity-90 tracking-tight">
            捕捉影像的律動，<br>
            <span class="font-retro italic text-[#8B7D6B]">編排歷史的節奏</span>
        </h1>
        <p class="text-lg md:text-xl opacity-70 max-w-2xl font-light">
            一位追求節奏感與視覺敘事的資訊傳播系學生。
        </p>
    </section>

    <section id="about" class="py-24 px-8 max-w-6xl mx-auto">
        <div class="grid md:grid-cols-2 gap-16 items-center">
            <div class="relative flex justify-center">
                <div class="w-64 h-64 md:w-80 md:h-80 bg-[#1a1a1a] rounded-full border-4 border-[#2A4B4C] flex items-center justify-center vinyl-record relative">
                    <div class="w-24 h-24 bg-[#D8C9AE] rounded-full border-2 border-[#2A4B4C] flex items-center justify-center">
                        <div class="w-4 h-4 bg-[#2A4B4C] rounded-full"></div>
                    </div>
                </div>
            </div>
            <div>
                <h2 class="text-3xl font-bold mb-6 font-retro underline decoration-[#8B7D6B] underline-offset-8">About Me</h2>
                <p class="text-lg leading-relaxed mb-6">
                    嘿，我是陳譽升。目前就讀世新大學資訊傳播學系大二。我喜歡將生冷的數據與歷史，透過 AI 工具與節奏感強烈的影像重新包裝。
                </p>
            </div>
        </div>
    </section>

    <section id="works" class="py-24 px-8 bg-[#2A4B4C] text-[#D8C9AE]">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-3xl font-bold mb-16 font-retro text-center">Selected Works</h2>
            <div class="grid md:grid-cols-2 gap-12 lg:gap-24 items-start">
                <div class="space-y-6">
                    <div class="bg-[#D8C9AE] p-2 card-shadow">
                        <div class="aspect-video bg-black overflow-hidden">
                            <iframe width="100%" height="100%" src="https://www.youtube.com/embed/cNd-twzWuOA" frameborder="0" allowfullscreen></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer id="contact" class="py-24 text-center px-8">
        <h2 class="text-2xl font-bold mb-8 font-retro tracking-widest">GET IN TOUCH</h2>
        <a href="mailto:eason.chen999999@gmail.com" class="inline-block bg-[#2A4B4C] text-[#D8C9AE] px-10 py-4 rounded-full font-bold hover:scale-105 transition-transform mb-12">
            Send me an Email
        </a>
    </footer>

    <script>
        // 平滑捲動與動畫邏輯... (保留你原有的 script)
    </script>
</body>
</html>
